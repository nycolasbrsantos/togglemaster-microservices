kind: Namespace
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: flag
  labels:
    app.kubernetes.io/part-of: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: targeting
  labels:
    app.kubernetes.io/part-of: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: evaluation
  labels:
    app.kubernetes.io/part-of: togglemaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    app.kubernetes.io/part-of: togglemaster
