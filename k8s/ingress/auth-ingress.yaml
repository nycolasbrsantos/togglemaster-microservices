# Ingress do auth-service: /auth/validate e /auth/admin/keys chegam ao servico como /validate e /admin/keys (o codigo nao tem prefixo /auth).
# O Ingress precisa morar no mesmo namespace do Service de destino; o Nginx
# Ingress Controller junta todos os Ingress sem host num unico Load Balancer.
# As anotacoes valem so para este objeto, por isso o rewrite nao vaza para os outros.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  namespace: auth
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
