# Ingress do flag-service: as rotas do codigo ja comecam em /flags: sem rewrite.
# O Ingress precisa morar no mesmo namespace do Service de destino; o Nginx
# Ingress Controller junta todos os Ingress sem host num unico Load Balancer.
# As anotacoes valem so para este objeto, por isso o rewrite nao vaza para os outros.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flag-service
  namespace: flag
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
