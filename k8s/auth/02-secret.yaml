# Secret: valores sensiveis em base64 (PDF). Os valores abaixo sao PLACEHOLDERS
# (o texto "PREENCHER_..." codificado). Troque cada um por:
#   printf %s 'valor-real' | base64
# (printf %s nao acrescenta quebra de linha; echo acrescentaria e quebraria a URL).
# NUNCA commitar este arquivo com valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth
type: Opaque
data:
  # endpoint do RDS do auth (aba Conectividade do RDS), usuario mestre e senha definidos na criacao do RDS, banco inicial auth_db
  DATABASE_URL: UFJFRU5DSEVSX3Bvc3RncmVzOi8vVVNVQVJJTzpTRU5IQUBFTkRQT0lOVF9SRFNfQVVUSDo1NDMyL2F1dGhfZGI=
  # chave mestra do auth (gerar uma nova, ex.: openssl rand -hex 32); usada no POST /admin/keys
  MASTER_KEY: UFJFRU5DSEVSX01BU1RFUl9LRVk=
