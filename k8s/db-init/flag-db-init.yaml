# Inicializa o RDS do flag-service com o db/init.sql do proprio servico.
# Por que um Job: o RDS fica em sub-rede privada, sem acesso de fora da VPC;
# o pod roda dentro do cluster e alcanca o RDS. Reusa o DATABASE_URL do
# Secret flag-service-secret (aplicar o Secret antes). O init.sql usa IF NOT EXISTS,
# entao rodar de novo nao quebra nada.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-db-init-sql
  namespace: flag
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,

        -- 'name' é a chave de negócio única (ex: 'enable-new-checkout')
        name VARCHAR(100) UNIQUE NOT NULL, 

        description TEXT,

        -- Este é o 'kill switch' global. Se for false, a flag está desativada para todos.
        is_enabled BOOLEAN NOT NULL DEFAULT false,

        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Opcional, mas boa prática: Trigger para atualizar 'updated_at' automaticamente
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- Remove o trigger se já existir, para evitar erro na recriação
    DROP TRIGGER IF EXISTS set_timestamp ON flags;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flag-service-db-init
  namespace: flag
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:17-alpine
          command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/init.sql && psql \"$DATABASE_URL\" -c '\\dt'"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: flag-service-db-init-sql
