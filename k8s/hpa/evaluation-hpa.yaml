# HPA do evaluation-service por CPU media (caminho quente: CPU sobe com as requisicoes do teste de carga (hey)).
# Depende do Metrics Server e dos resources.requests do Deployment
# (a porcentagem e calculada sobre o request de CPU).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-service
  namespace: evaluation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
