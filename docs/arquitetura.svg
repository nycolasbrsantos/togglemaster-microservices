  <rect x="215" y="680" width="975" height="265" fill="#fbe9e7" stroke="#bf360c" stroke-dasharray="6 4" stroke-width="1.5" rx="10"/>
  <text x="230" y="701" class="grp" fill="#bf360c">Sub-redes privadas 10.0.128.0/20 e 10.0.144.0/20 (sem rota para a internet) · SG togglemaster-db-sg: 5432 e 6379 só de 10.0.0.0/16</text>

  <rect x="240" y="800" width="205" height="86" class="db"/>
  <text x="342" y="828" text-anchor="middle" class="tb">RDS PostgreSQL 17.11</text>
  <text x="342" y="848" text-anchor="middle" class="t">auth_db</text>
  <text x="342" y="868" text-anchor="middle" class="ts">db.t4g.micro · Single-AZ</text>

  <rect x="470" y="800" width="205" height="86" class="db"/>
  <text x="572" y="828" text-anchor="middle" class="tb">RDS PostgreSQL 17.11</text>
  <text x="572" y="848" text-anchor="middle" class="t">flags_db</text>
  <text x="572" y="868" text-anchor="middle" class="ts">db.t4g.micro · Single-AZ</text>

  <rect x="700" y="800" width="205" height="86" class="db"/>
  <text x="802" y="828" text-anchor="middle" class="tb">RDS PostgreSQL 17.11</text>
  <text x="802" y="848" text-anchor="middle" class="t">targeting_db</text>
  <text x="802" y="868" text-anchor="middle" class="ts">db.t4g.micro · Single-AZ</text>

  <rect x="935" y="800" width="225" height="86" class="db"/>
  <text x="1047" y="828" text-anchor="middle" class="tb">ElastiCache Redis OSS 7.1</text>
  <text x="1047" y="848" text-anchor="middle" class="t">cache.t4g.micro · 0 réplicas</text>
  <text x="1047" y="868" text-anchor="middle" class="ts">cache-aside, TTL 30 s</text>

  <!-- Servicos regionais fora da VPC -->
  <text x="1240" y="150" class="grp" fill="#6a1b9a">Serviços regionais</text>
  <rect x="1235" y="175" width="225" height="80" class="ext"/>
  <text x="1347" y="203" text-anchor="middle" class="tb">ECR</text>
  <text x="1347" y="223" text-anchor="middle" class="ts">5 repositórios imutáveis</text>
  <text x="1347" y="240" text-anchor="middle" class="ts">tag 1.0.0 · arm64</text>

  <rect x="1235" y="450" width="225" height="70" class="ext"/>
  <text x="1347" y="478" text-anchor="middle" class="tb">SQS Standard</text>
  <text x="1347" y="498" text-anchor="middle" class="ts">togglemaster-events</text>

  <rect x="1235" y="590" width="225" height="80" class="ext"/>
  <text x="1347" y="618" text-anchor="middle" class="tb">DynamoDB</text>
  <text x="1347" y="638" text-anchor="middle" class="ts">ToggleMasterAnalytics</text>
  <text x="1347" y="655" text-anchor="middle" class="ts">chave event_id · sob demanda</text>

  <!-- Setas: entrada -->
  <path d="M150,207 L233,207" class="ln"/>
  <text x="158" y="198" class="lbl">HTTP</text>
  <path d="M415,225 L453,233" class="ln"/>

  <!-- Ingress para servicos -->
  <path d="M520,266 L520,318" class="lnb"/>
  <text x="474" y="298" class="lbl">/auth</text>
  <path d="M640,266 L740,318" class="lnb"/>
  <text x="690" y="290" class="lbl">/flags</text>
  <path d="M675,262 L960,318" class="lnb"/>
  <text x="840" y="287" class="lbl">/targeting</text>
  <path d="M580,266 C580,420 600,430 610,468" class="lnb"/>
  <text x="520" y="440" class="lbl">/evaluate</text>

  <!-- flag e targeting validam no auth -->
  <path d="M680,356 L652,356" class="ln"/>
  <path d="M1012,392 C1012,440 700,440 600,394" class="ln"/>
  <text x="880" y="415" class="lbl">/validate (fail-closed: auth fora = 503)</text>

  <!-- evaluation chama flag e targeting -->
  <path d="M700,470 L760,394" class="ln"/>
  <path d="M745,470 L950,394" class="ln"/>
  <text x="772" y="462" class="lbl">SERVICE_API_KEY</text>

  <!-- evaluation para Redis -->
  <path d="M700,548 L700,600 L1047,600 L1047,798" class="ln"/>
  <text x="790" y="594" class="lbl">GET/SET EX 30 (redis://)</text>

  <!-- evaluation para SQS e SQS para analytics -->
  <path d="M640,548 L640,620 L1200,620 L1200,490 L1233,490" class="lnd"/>
  <text x="1110" y="614" class="lbl">evento assíncrono</text>
  <path d="M1235,470 L1107,495" class="lnd"/>
  <text x="1120" y="462" class="lbl">long polling</text>
  <path d="M1105,535 L1233,620" class="ln"/>
  <text x="1140" y="590" class="lbl">grava</text>

  <!-- servicos para RDS -->
  <path d="M500,392 L500,760 L342,760 L342,798" class="ln"/>
  <path d="M840,392 L840,650 L572,650 L572,798" class="ln"/>
  <path d="M1100,392 L1100,450 L1170,450 L1170,770 L802,770 L802,798" class="ln"/>

  <!-- ECR pull e metricas -->
  <path d="M1235,215 L1177,215" class="lnd"/>
  <text x="1182" y="207" class="lbl">pull</text>
  <path d="M1040,258 L990,468" class="lnd"/>
  <path d="M1000,258 L700,468" class="lnd"/>
  <text x="1005" y="300" class="lbl">métricas de CPU</text>

  <!-- Legenda -->
  <rect x="20" y="300" width="140" height="190" fill="#ffffff" stroke="#b0bec5" rx="8"/>
  <text x="30" y="322" class="tb">Legenda</text>
  <line x1="30" y1="342" x2="70" y2="342" stroke="#1565c0" stroke-width="1.6"/>
  <text x="76" y="346" class="lbl">Ingress</text>
  <line x1="30" y1="364" x2="70" y2="364" stroke="#37474f" stroke-width="1.6"/>
  <text x="76" y="368" class="lbl">síncrono</text>
  <line x1="30" y1="386" x2="70" y2="386" stroke="#37474f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="76" y="390" class="lbl">assíncrono</text>
  <rect x="30" y="402" width="18" height="14" class="svc"/>
  <text x="54" y="414" class="lbl">pod / Service</text>
  <rect x="30" y="426" width="18" height="14" class="db"/>
  <text x="54" y="438" class="lbl">banco na VPC</text>
  <rect x="30" y="450" width="18" height="14" class="ext"/>
  <text x="54" y="462" class="lbl">serviço regional</text>
  <text x="30" y="480" class="lbl">ns = namespace</text>
