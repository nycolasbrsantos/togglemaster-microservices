<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="setaAz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <style>
      .t { font-size: 14px; fill: #263238; }
      .tb { font-size: 15px; font-weight: bold; fill: #263238; }
      .ts { font-size: 12px; fill: #455a64; }
      .grp { font-size: 15px; font-weight: bold; }
      .box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 8; }
      .svc { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 8; }
      .db { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; rx: 8; }
      .ext { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.5; rx: 8; }
      .ln { stroke: #37474f; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .lnd { stroke: #37474f; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
      .lnb { stroke: #1565c0; stroke-width: 1.6; fill: none; marker-end: url(#setaAz); }
      .lbl { font-size: 11.5px; fill: #37474f; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#fafafa"/>
  <text x="20" y="28" class="tb" font-size="18">ToggleMaster Fase 2: arquitetura na AWS (us-east-1, AWS Academy Learner Lab)</text>

  <!-- Usuario -->
  <rect x="20" y="175" width="130" height="64" class="box"/>
  <text x="85" y="202" text-anchor="middle" class="tb">Usuário</text>
  <text x="85" y="222" text-anchor="middle" class="ts">curl / hey</text>

  <!-- Regiao AWS -->
  <rect x="170" y="45" width="1310" height="935" fill="none" stroke="#ff9800" stroke-width="2" rx="12"/>
  <text x="185" y="68" class="grp" fill="#e65100">AWS us-east-1</text>

  <!-- VPC -->
  <rect x="195" y="85" width="1015" height="880" fill="#f1f8e9" stroke="#558b2f" stroke-width="2" rx="12"/>
  <text x="210" y="108" class="grp" fill="#33691e">VPC togglemaster-vpc 10.0.0.0/16 · 2 AZs (us-east-1a, us-east-1b) · Internet Gateway · sem NAT</text>

  <!-- Sub-redes publicas -->
  <rect x="215" y="122" width="975" height="535" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="6 4" stroke-width="1.5" rx="10"/>
  <text x="230" y="143" class="grp" fill="#1b5e20">Sub-redes públicas 10.0.0.0/20 e 10.0.16.0/20 (IP público automático, tag kubernetes.io/role/elb)</text>

  <!-- LB -->
  <rect x="235" y="175" width="180" height="70" class="box"/>
  <text x="325" y="200" text-anchor="middle" class="tb">Load Balancer</text>
  <text x="325" y="219" text-anchor="middle" class="ts">Service LoadBalancer</text>
  <text x="325" y="235" text-anchor="middle" class="ts">do ingress-nginx</text>

  <!-- EKS -->
  <rect x="435" y="155" width="740" height="485" fill="#ffffff" stroke="#0d47a1" stroke-width="2" rx="10"/>
  <text x="450" y="176" class="grp" fill="#0d47a1">EKS togglemaster-cluster 1.37</text>
  <text x="450" y="194" class="ts">Managed Node Group: 2x t4g.medium arm64 (min 1, máx 4), role LabRole</text>

  <rect x="455" y="208" width="230" height="58" class="box"/>
  <text x="570" y="231" text-anchor="middle" class="tb">Ingress (classe nginx)</text>
  <text x="570" y="251" text-anchor="middle" class="ts">/auth /flags /targeting /evaluate</text>

  <rect x="975" y="208" width="180" height="50" class="box"/>
  <text x="1065" y="238" text-anchor="middle" class="t">metrics-server</text>

  <!-- Servicos linha 1 -->
  <rect x="455" y="320" width="195" height="72" class="svc"/>
  <text x="552" y="342" text-anchor="middle" class="ts">ns auth</text>
  <text x="552" y="362" text-anchor="middle" class="tb">auth-service :8001</text>
  <text x="552" y="380" text-anchor="middle" class="ts">Go · 2 réplicas</text>

  <rect x="680" y="320" width="195" height="72" class="svc"/>
  <text x="777" y="342" text-anchor="middle" class="ts">ns flag</text>
  <text x="777" y="362" text-anchor="middle" class="tb">flag-service :8002</text>
  <text x="777" y="380" text-anchor="middle" class="ts">Python/Flask</text>

  <rect x="905" y="320" width="215" height="72" class="svc"/>
  <text x="1012" y="342" text-anchor="middle" class="ts">ns targeting</text>
  <text x="1012" y="362" text-anchor="middle" class="tb">targeting-service :8003</text>
  <text x="1012" y="380" text-anchor="middle" class="ts">Python/Flask</text>

  <!-- Servicos linha 2 -->
  <rect x="540" y="470" width="225" height="78" class="svc"/>
  <text x="652" y="492" text-anchor="middle" class="ts">ns evaluation</text>
  <text x="652" y="512" text-anchor="middle" class="tb">evaluation-service :8004</text>
  <text x="652" y="531" text-anchor="middle" class="ts">Go · HPA CPU 70% (1 a 5)</text>

  <rect x="880" y="470" width="225" height="78" class="svc"/>
  <text x="992" y="492" text-anchor="middle" class="ts">ns analytics</text>
  <text x="992" y="512" text-anchor="middle" class="tb">analytics-service :8005</text>
  <text x="992" y="531" text-anchor="middle" class="ts">worker SQS · HPA CPU 70%</text>

